name: CI Build and Test

on:
  push:
    branches: [ "main", "dung" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. BUILD & TEST BACKEND (.NET 9)
  # ==========================================
  backend:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TaskManagementSystem/TaskManagementSystem.sln

      - name: Build Backend
        run: dotnet build backend/TaskManagementSystem/TaskManagementSystem.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test backend/TaskManagementSystem/TaskManagementSystem.sln --no-build --configuration Release --verbosity normal

  # ==========================================
  # 2. BUILD FRONTEND (React + Vite)
  # ==========================================
  frontend:
    name: Frontend Build (React Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/task-management-system-fe/package-lock.json

      - name: Install dependencies
        working-directory: frontend/task-management-system-fe
        run: npm ci

      - name: Build Frontend
        working-directory: frontend/task-management-system-fe
        run: npm run build

  # ==========================================
  # 3. VERIFY DOCKER COMPOSE BUILD
  # ==========================================
  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: docker compose build